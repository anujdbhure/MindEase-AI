apiVersion: apps/v1
kind: Deployment
metadata:
  name: mindease-deployment
  labels:
    app: mindease
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mindease
  template:
    metadata:
      labels:
        app: mindease
    spec:
      containers:
        - name: mindease
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
